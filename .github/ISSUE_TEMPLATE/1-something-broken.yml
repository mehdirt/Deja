name: Something's broken
description: Deja did something wrong, or didn't do something it should have.
title: 'Something is broken: '
labels: ['needs triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time — a report like this is the only way problems
        get found, since Deja never sends anything about your usage on its own.

        **Please don't paste your actual prompt text.** It can contain personal
        details, and this page is public. Describing it ("a long email to my
        landlord") tells us everything we need.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: In your own words. No need for technical terms.
      placeholder: I sent a message on ChatGPT and it never showed up in my library.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen instead?
      placeholder: I expected to find it when I searched my saved prompts.
    validations:
      required: false

  - type: dropdown
    id: site
    attributes:
      label: Which site were you on?
      options:
        - ChatGPT
        - Claude
        - Gemini
        - DeepSeek
        - Grok
        - Somewhere else / not sure
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Which version of Deja?
      description: >-
        Settings shows this at the very bottom (like "Deja v0.5.0"). If you
        opened this from the button inside Deja, it's already filled in.
      placeholder: v0.5.0
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Which browser?
      placeholder: Chrome 141 on macOS
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Anything else worth knowing?
      description: >-
        Optional. If you opened this from a button inside Deja, it may have
        filled in what it already knew about the problem.
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Before you send
      options:
        - label: >-
            I've checked there's no personal information (email, address, card,
            password, or my real prompt text) in what I wrote above.
          required: true
